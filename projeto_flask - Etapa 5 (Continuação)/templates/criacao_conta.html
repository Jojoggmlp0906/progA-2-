<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criação de Conta - Banco Simples</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Meu Banco</h1>
        <h3>Criar Nova Conta</h3>

        <!-- Exibe alertas caso falte algum dado -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/criandoconta" method="POST">
            <label for="numero">Número da Conta:</label>
            <input type="number" id="numero" name="numero" placeholder="Ex: 1020" required>

            <label for="tipo">Tipo da Conta:</label>
            <select id="tipo" name="tipo" required style="width: 100%; padding: 8px; margin-bottom: 15px;">
                <option value="" disabled selected>Selecione o tipo...</option>
                <option value="Corrente">Conta Corrente</option>
                <option value="Poupança">Conta Poupança</option>
            </select>

            <button type="submit">Criar Conta</button>
        </form>
    </div>
</body>
</html>
