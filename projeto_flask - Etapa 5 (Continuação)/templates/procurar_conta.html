<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Banco Simples</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h3>Busque a conta que deseja</h3>
        <form action="/buscar" method="POST">
            <input type="hidden" name="conta" value="{{ conta_html }}">
            <label for="buscador"> Digite a conta: </label>
            <input type="number" name="buscador" placeholder="Ex: 0303" required>
            <button type="submit">Procurar</button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                    <li class="alert alert-{{ category }}">
                        {{ message }}
                    </li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <!-- Botão atualizado para voltar ao menu da conta atual -->
        <form action="/voltar-opcoes" method="POST" style="margin-top: 15px;">
            <input type="hidden" name="conta" value="{{ conta_html }}">
            <button type="submit" class="btn-secundario">Voltar ao Menu</button>
        </form>
    </div>
</body>
</html>
