<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Banco Simples</title>
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Meu Banco</h1>
        <h3>Criação de Conta</h3>

        <form action="/user" method="POST">
            <label for="conta">Digite o número da conta:</label>
            <input type="number" id="conta" name="conta" placeholder="Ex: 0202" required>

            <label for="nome">Digite seu nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Joadson Barbosa" required>

            <!-- NOVOS CAMPOS EXIGIDOS PELA ETAPA 5 -->
            <label for="cpf">Digite seu CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="Ex: 000.000.000-00" required>

            <label for="salario">Digite seu salário:</label>
            <input type="number" step="0.01" id="salario" name="salario" placeholder="Ex: 2500.00" required>

            <label for="telefone">Digite seu telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="Ex: (79) 99999-9999" required>

            <label for="tipo_conta">Tipo de Conta:</label>
            <select id="tipo_conta" name="tipo_conta" required>
                <option value="Corrente">Conta Corrente</option>
                <option value="Poupança">Conta Poupança</option>
            </select>

            <button type="submit">Entrar / Cadastrar</button>
        </form>
    </div>
</body>
</html>
