<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Banco Simples</title>
    <!-- Link para o CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Área de saque</h1>
    <br>
    <h2>Olá, {{ nome_html }}</h2>
    <br>
    <h3>Saldo Atual: R$ {{ "%.2f" | format(saldo_atual) }}</h3>
    
    <form action="/sacar" method="POST">
        <input type="hidden" name="conta" value="{{ conta_html }}">
        <label>Digite o valor para sacar:</label>
        <!-- CORRIGIDO 'typr' para 'type' e adicionado step e required -->
        <input type="number" step="0.01" name="valor_saque" required>
        <button type="submit">Confirmar Saque</button>
    </form>
</body>
</html>
