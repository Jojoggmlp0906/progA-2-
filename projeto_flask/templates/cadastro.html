<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h3>Cadastre-se na agência {{ agencia_html }}</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
        <!-- ADICIONADO O FORMULÁRIO AQUI -->
        <form action="/fazercadastro" method="POST">
            <label for="nome">Digite seu nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Carlos" required>

            <label for="salario">Digite seu salário:</label>
            <input type="number" step="0.01" id="salario" name="salario" placeholder="Ex: 2500.00" required>

            <label for="telefone">Digite seu telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="Ex: (79) 99999-9999" required>
            
            <button type="submit">Confirmar</button>
        </form>
    </div>
</body>
</html>
